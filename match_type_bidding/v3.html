<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Match Type Bidding V3</title>
  <link rel="preconnect" href="https://rsms.me/" />
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  <style>
    :root {
      --ink-primary:   #20203c;
      --ink-darker:    #535665;
      --ink-dark:      #888b9a;
      --ink-light:     #b8bec6;

      --surface-primary: #ffffff;
      --surface-lighter: #f8f9fa;
      --surface-light:   #eff2f5;
      --surface-dark:    #e9ecf1;

      --edge-lighter:  #e7eaee;
      --edge-light:    #dadde1;
      --edge-primary:  #d1d5db;
      --edge-dark:     #c7cad1;

      --accent-primary: #2874c1;
      --accent-lightest: #f6fafe;

      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 16px;
      --radius-xxl: 32px;

      --shadow-sm:
        0 1px 4px rgba(33,35,44,.08),
        0 0   1px rgba(33,35,44,.04),
        0 1px 1px 1px rgba(33,35,44,.04);

      --shadow-modal:
        0 8px 32px rgba(33,35,44,.18),
        0 2px 8px  rgba(33,35,44,.10),
        0 0   1px  rgba(33,35,44,.08);

      --font: "Limitless Sans", "Inter", -apple-system, system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.4286;
      color: var(--ink-primary);
      background: var(--surface-light);
      -webkit-font-smoothing: antialiased;
      font-feature-settings: "lnum" 1, "pnum" 1;
    }

    /* ── Version bar ── */
    .version-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 36px;
      background: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      z-index: 200;
    }
    .version-tab {
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 12px;
      border-radius: 4px;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.5);
      font-family: var(--font);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
    }
    .version-tab:hover { color: rgba(255,255,255,0.8); }
    .version-tab.active { background: rgba(255,255,255,0.12); color: #fff; }

    .page {
      min-height: 100vh;
      padding: 76px 24px 40px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* ── Panel ── */
    .panel {
      width: 746px;
      max-width: 100%;
      background: var(--surface-primary);
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* ── Panel top row ── */
    .panel-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-title-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .panel-title {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.5px;
      line-height: 28px;
    }

    /* ── Icon button ── */
    .icon-btn {
      border: none;
      background: transparent;
      padding: 0;
      width: 16px;
      height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--ink-dark);
      border-radius: var(--radius-md);
      flex-shrink: 0;
    }
    .icon-btn:hover { color: var(--ink-primary); }
    .icon-btn--accent { color: var(--accent-primary); }
    .icon-btn--accent:hover { color: var(--accent-dark, #1a5fa8); }
    .icon-btn svg { width: 16px; height: 16px; display: block; }

    /* ── Default Bid compound chip ── */
    .default-bid {
      display: flex;
      align-items: center;
      background: var(--surface-primary);
      border: 1px solid var(--edge-lighter);
      border-radius: var(--radius-md);
      height: 36px;
    }

    .default-bid__label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 8px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: -0.14px;
      white-space: nowrap;
    }

    .default-bid__sep {
      width: 1px;
      height: 24px;
      background: var(--edge-lighter);
      flex-shrink: 0;
    }

    .default-bid__value {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      font-size: 14px;
      color: var(--ink-darker);
      letter-spacing: -0.14px;
    }

    /* ── Keywords section ── */
    .kw-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.12px;
      line-height: 22px;
    }

    .badge {
      background: var(--surface-dark);
      border-radius: var(--radius-xxl);
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.06px;
      line-height: 16px;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* ── Search input ── */
    .search-wrap {
      position: relative;
      width: 358px;
    }
    .search-wrap .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      color: var(--ink-dark);
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      height: 40px;
      padding: 10px 16px 10px 40px;
      border: 1px solid var(--edge-dark);
      border-radius: var(--radius-md);
      font: inherit;
      font-size: 14px;
      color: var(--ink-primary);
      background: var(--surface-primary);
    }
    .search-input::placeholder { color: var(--ink-dark); }
    .search-input:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(40,116,193,.18);
    }

    /* ── Buttons ── */
    .btn-group { display: flex; gap: 8px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.14px;
      padding: 10px 16px;
      border-radius: var(--radius-md);
      cursor: pointer;
      white-space: nowrap;
      transition: background 120ms;
    }
    .btn-ghost {
      border: none;
      background: transparent;
      color: var(--accent-primary);
    }
    .btn-ghost:hover { background: rgba(40,116,193,.07); }

    .btn-outline {
      border: 1px solid var(--accent-primary);
      background: transparent;
      color: var(--accent-primary);
    }
    .btn-outline:hover { background: rgba(40,116,193,.07); }

    .btn-primary {
      border: 1px solid var(--accent-primary);
      background: var(--accent-primary);
      color: #fff;
    }
    .btn-primary:hover { background: #1f5fa8; border-color: #1f5fa8; }

    .btn-tertiary {
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink-darker);
    }
    .btn-tertiary:hover { background: var(--surface-light); color: var(--ink-primary); }

    /* ── Empty state ── */
    .kw-empty {
      background: var(--surface-light);
      border-radius: var(--radius-lg);
      padding: 48px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .kw-empty__text {
      font-size: 14px;
      color: var(--ink-dark);
      letter-spacing: -0.14px;
      text-align: center;
    }

    /* ── Bid management table ── */
    .kw-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .kw-table th {
      text-align: left;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.14px;
      color: var(--ink-darker);
      padding: 14px 16px;
      border-bottom: 1px solid var(--edge-dark);
      white-space: nowrap;
      vertical-align: middle;
    }

    .kw-table td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--edge-lighter);
      vertical-align: top;
    }

    col.col-keyword   { width: 158px; }
    col.col-strategy  { width: 145px; }
    col.col-suggested { width: 103px; }
    col.col-default   { width: 84px;  }
    col.col-bid       { width: 192px; }

    td.cell-default { padding-top: 15px; }

    .th-inner {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── Strategy tags ── */
    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 2px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      background: var(--surface-light);
      border-radius: var(--radius-sm);
      padding: 4px 8px;
      font-size: 12px;
      line-height: 16px;
      letter-spacing: -0.06px;
      white-space: nowrap;
    }

    /* ── Suggested bid ── */
    .suggested-bid {
      display: flex;
      flex-direction: column;
    }
    .suggested-bid__price {
      font-size: 14px;
      color: var(--ink-darker);
      line-height: 20px;
    }
    .suggested-bid__cta {
      font-size: 14px;
      color: var(--accent-primary);
      line-height: 20px;
      background: none;
      border: none;
      padding: 0;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      font-feature-settings: "lnum" 1, "pnum" 1;
    }
    .suggested-bid__cta:disabled {
      color: var(--ink-light);
      cursor: default;
    }

    /* ── Toggle switch ── */
    .switch {
      display: flex;
      align-items: center;
      width: 40px;
      height: 20px;
      border-radius: 100px;
      padding: 4px;
      cursor: pointer;
      border: none;
      transition: background 150ms;
      flex-shrink: 0;
    }
    .switch[data-on="false"] {
      background: var(--ink-light);
      justify-content: flex-start;
    }
    .switch[data-on="true"] {
      background: var(--accent-primary);
      justify-content: flex-end;
    }
    .switch__knob {
      width: 12px;
      height: 12px;
      border-radius: 100px;
      background: var(--surface-primary);
      flex-shrink: 0;
    }

    /* ── Bid amount column ── */
    .bid-rows {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .bid-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 24px;
    }

    .match-type-label {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.88px;
      text-transform: uppercase;
      color: var(--ink-darker);
      line-height: 15px;
      flex-shrink: 0;
    }

    .bid-input {
      display: flex;
      align-items: center;
      width: 102px;
      height: 24px;
      padding: 0 8px;
      border: 1px solid var(--edge-dark);
      border-radius: var(--radius-md);
      background: var(--surface-primary);
      font: inherit;
      font-size: 14px;
      color: var(--ink-dark);
      flex-shrink: 0;
      gap: 0;
    }
    .bid-input .dollar {
      flex-shrink: 0;
      margin-right: 1px;
    }
    .bid-input input {
      border: none;
      background: transparent;
      font: inherit;
      font-size: 14px;
      color: inherit;
      width: 100%;
      padding: 0;
      min-width: 0;
    }
    .bid-input input:focus { outline: none; }
    .bid-input:focus-within {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(40,116,193,.18);
    }
    .bid-input.disabled {
      background: var(--surface-lighter);
      color: var(--ink-light);
    }
    .bid-input.disabled input { color: var(--ink-light); }

    /* ── Pagination ── */
    .pagination {
      display: flex;
      align-items: center;
      gap: 40px;
    }

    .pagination-left {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    .pagination-info {
      font-size: 14px;
      color: var(--ink-darker);
      letter-spacing: -0.14px;
      white-space: nowrap;
    }
    .pagination-info strong {
      color: var(--ink-primary);
      font-weight: 600;
    }

    .rows-selector {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 32px;
      padding: 0 8px;
      border: 1px solid var(--edge-primary);
      border-radius: var(--radius-md);
      background: var(--surface-primary);
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .rows-selector svg { width: 20px; height: 20px; display: block; }

    .pagination-controls {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-left: auto;
    }

    .page-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: var(--radius-md);
      border: none;
      background: transparent;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink-darker);
      cursor: pointer;
    }
    .page-btn:hover { background: var(--surface-light); }
    .page-btn.active {
      border: 1px solid var(--accent-primary);
      color: var(--ink-primary);
    }
    .page-btn svg { width: 20px; height: 20px; display: block; }

    body.embedded { background: transparent; }
    body.embedded .page { padding: 0; min-height: auto; }
    body.embedded .version-bar { display: none; }

    .back-to-library {
      position: absolute;
      left: 12px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,0.5);
      text-decoration: none;
      letter-spacing: -0.1px;
      line-height: 1;
      transition: color 120ms;
    }
    .back-to-library:hover { color: rgba(255,255,255,0.85); }

    /* ── Chip + dropdown (mirrors Meridian mds-popover-trigger-chip / mds-popover) ── */
    .kw-chip-wrap { position: relative; display: inline-flex; }

    .kw-chip[aria-expanded="true"],
    .kw-chip.has-selection { border-color: var(--accent-primary); }
    .kw-chip-chevron { flex-shrink: 0; }
    .kw-chip-sep { width: 1px; height: 12px; background: var(--edge-primary); flex-shrink: 0; }
    .kw-chip-value { color: var(--ink-primary); font-size: 14px; font-weight: 600; letter-spacing: -0.14px; }
    .kw-chip-close { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; color: var(--ink-dark); }
    .kw-chip-close svg { width: 10px; height: 10px; }
    .kw-chip-close:hover { color: var(--ink-primary); background: var(--surface-dark); }
    .kw-chip-sep[hidden], .kw-chip-value[hidden], .kw-chip-close[hidden] { display: none; }
    .kw-chip-chevron[hidden] { display: none; }

    /* Meridian popover */
    .kw-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      z-index: 600;
      background: var(--surface-primary);
      border: 1px solid var(--edge-light);
      border-radius: var(--radius-md);
      box-shadow: 0 8px 24px rgba(32,32,60,.12), 0 2px 6px rgba(32,32,60,.06);
      min-width: 240px;
      padding: 4px 0;
    }
    .kw-dropdown[hidden] { display: none; }

    /* Meridian popover item — wraps a hidden checkbox + .mds-check visual */
    .kw-dd-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 14px;
      line-height: 20px;
      letter-spacing: -0.14px;
      color: var(--ink-primary);
      user-select: none;
    }
    .kw-dd-item:hover { background: var(--surface-lighter); }

    /* Real checkbox hidden; .mds-check is the visual */
    .kw-dd-item input[type="checkbox"] { position: absolute; opacity: 0; pointer-events: none; }

    .mds-check {
      width: 16px;
      height: 16px;
      border: 1.5px solid var(--ink-light);
      border-radius: 3px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--surface-primary);
      transition: background .12s, border-color .12s;
    }
    .mds-check svg { width: 11px; height: 11px; display: none; }
    .kw-dd-item input[type="checkbox"]:checked + .mds-check {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
    }
    .kw-dd-item input[type="checkbox"]:checked + .mds-check svg { display: block; }

    .kw-dd-divider { height: 1px; background: var(--edge-lighter); margin: 4px 0; }
    .kw-dd-footer { padding: 6px 16px 8px; }

    .kw-dd-clear {
      background: none;
      border: none;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.14px;
      color: var(--accent-primary);
      cursor: pointer;
      padding: 0;
    }
    .kw-dd-clear:hover { color: #1f5fa8; }

    /* ═══════════════════════════════════════════════════════════
       MODAL
    ═══════════════════════════════════════════════════════════ */

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(20, 20, 44, 0.48);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .kw-modal {
      background: var(--surface-primary);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-modal);
      width: 1000px;
      max-width: 100%;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Modal header */
    .kw-modal__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 24px 24px;
      border-bottom: 1px solid var(--edge-primary);
      flex-shrink: 0;
    }

    .kw-modal__title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 28px;
    }

    .kw-modal__close {
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-dark);
      border-radius: var(--radius-md);
      flex-shrink: 0;
    }
    .kw-modal__close:hover { color: var(--ink-primary); background: var(--surface-light); }
    .kw-modal__close svg { width: 20px; height: 20px; display: block; }

    /* Modal body: two panels */
    .kw-modal__body {
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    /* Left panel */
    .kw-modal__left {
      width: 600px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--edge-lighter);
      min-height: 0;
    }

    /* Tabs */
    .kw-tabs {
      display: flex;
      align-items: flex-end;
      height: 56px;
      padding: 0 24px;
      border-bottom: 1px solid var(--edge-lighter);
      gap: 4px;
      flex-shrink: 0;
    }

    .kw-tab {
      height: 40px;
      padding: 0 4px;
      border: none;
      background: transparent;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.14px;
      color: var(--ink-dark);
      cursor: pointer;
      position: relative;
      white-space: nowrap;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .kw-tab:hover { color: var(--ink-primary); }
    .kw-tab.active {
      color: var(--ink-primary);
      border-bottom-color: var(--accent-primary);
    }

    /* Search area */
    .kw-search-area {
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border-bottom: 1px solid var(--edge-lighter);
      flex-shrink: 0;
    }

    .kw-modal-search {
      width: 100%;
      height: 36px;
      padding: 8px 12px 8px 36px;
      border: 1px solid var(--edge-dark);
      border-radius: var(--radius-md);
      font: inherit;
      font-size: 14px;
      color: var(--ink-primary);
      background: var(--surface-primary);
      position: relative;
    }
    .kw-modal-search::placeholder { color: var(--ink-dark); }
    .kw-modal-search:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(40,116,193,.18);
    }

    .kw-search-wrap {
      position: relative;
    }
    .kw-search-wrap .kw-search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--ink-dark);
      pointer-events: none;
    }

    .kw-filter-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .kw-chips {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }

    .kw-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 32px;
      padding: 0 16px;
      border: 1px solid var(--edge-light);
      border-radius: var(--radius-md);
      background: var(--surface-primary);
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.14px;
      color: var(--ink-darker);
      cursor: pointer;
      white-space: nowrap;

    .kw-chip:hover { background: var(--surface-lighter); }

      align-items: center;
      justify-content: center;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.14px;
      padding: 6px 16px;
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      background: transparent;
      color: var(--ink-light);
      cursor: default;
      white-space: nowrap;
      pointer-events: none;
      transition: background 120ms ease, color 120ms ease;
      flex-shrink: 0;
    }
    .kw-clear-filters.active {
      color: var(--ink-darker);
      cursor: pointer;
      pointer-events: auto;
    }
    .kw-clear-filters.active:hover {
      background: var(--surface-light);
      color: var(--ink-primary);
    }

    /* Modal keyword table */
    .kw-modal__table-wrap {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    .kw-sel-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .kw-sel-table colgroup col:nth-child(1) { width: 32px; }
    .kw-sel-table colgroup col:nth-child(2) { width: 56px; }
    .kw-sel-table colgroup col:nth-child(3) { width: 154px; }
    .kw-sel-table colgroup col:nth-child(4) { width: auto; }
    .kw-sel-table colgroup col:nth-child(5) { width: 88px; }

    .kw-sel-table thead th {
      position: sticky;
      top: 0;
      background: var(--surface-primary);
      z-index: 1;
      text-align: left;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.14px;
      color: var(--ink-darker);
      padding: 12px 8px;
      border-bottom: 1px solid var(--edge-dark);
      white-space: nowrap;
    }

    .kw-sel-table thead th:first-child { padding-left: 16px; }
    .kw-sel-table thead th:last-child  { text-align: right; padding-right: 16px; color: var(--accent-primary); cursor: pointer; }
    .kw-sel-table thead th:last-child:hover { color: #1f5fa8; }

    .kw-sel-table tbody tr.kw-row {
      cursor: pointer;
    }
    .kw-sel-table tbody tr.kw-row:hover td {
      background: var(--surface-lighter);
    }
    .kw-sel-table tbody tr.kw-row td {
      padding: 14px 8px;
      border-bottom: 1px solid var(--edge-lighter);
      vertical-align: top;
      font-size: 14px;
    }
    .kw-sel-table tbody tr.kw-row td:first-child { padding-left: 8px; }
    .kw-sel-table tbody tr.kw-row td:last-child  { text-align: right; padding-right: 16px; }

    .kw-chevron-btn {
      width: 24px;
      height: 24px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-dark);
      border-radius: var(--radius-sm);
      flex-shrink: 0;
    }
    .kw-chevron-btn:hover { color: var(--ink-primary); background: var(--surface-light); }
    .kw-chevron-btn svg { width: 16px; height: 16px; display: block; }

    .kw-rank {
      font-size: 14px;
      color: var(--ink-darker);
      letter-spacing: -0.14px;
    }

    .kw-word {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: -0.14px;
      line-height: 20px;
    }

    .kw-add-btn {
      background: none;
      border: none;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.14px;
      color: var(--accent-primary);
      cursor: pointer;
      padding: 0;
      white-space: nowrap;
    }
    .kw-add-btn:hover { color: #1f5fa8; }
    .kw-add-btn:disabled,
    .kw-add-btn.all-added { color: var(--ink-light); cursor: default; }

    /* Expanded sub-row */
    .kw-exp-row td {
      background: var(--surface-lighter);
      border-bottom: 1px solid var(--edge-lighter);
      padding: 4px 8px;
      height: 70px;
      vertical-align: top;
    }
    .kw-exp-row td:last-child { padding-right: 16px; }

    .exp-types {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      padding-top: 2px;
    }

    .exp-type-label {
      font-size: 12px;
      font-weight: 400;
      letter-spacing: -0.06px;
      line-height: 22px;
      color: var(--ink-darker);
    }

    .exp-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      padding-top: 2px;
    }

    .exp-add-btn {
      background: none;
      border: none;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.06px;
      line-height: 22px;
      color: var(--accent-primary);
      cursor: pointer;
      padding: 0;
      white-space: nowrap;
      text-align: right;
    }
    .exp-add-btn:hover { color: #1f5fa8; }
    .exp-add-btn.is-added {
      color: var(--ink-light);
      cursor: default;
    }

    /* Modal pagination */
    .kw-modal__pagination {
      padding: 12px 24px;
      border-top: 1px solid var(--edge-lighter);
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .kw-pag-info {
      font-size: 14px;
      color: var(--ink-darker);
      letter-spacing: -0.14px;
    }
    .kw-pag-info strong {
      color: var(--ink-primary);
      font-weight: 600;
    }

    .kw-pag-controls {
      display: flex;
      align-items: center;
      gap: 2px;
      margin-left: auto;
    }

    .kw-pag-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: var(--radius-md);
      border: none;
      background: transparent;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink-darker);
      cursor: pointer;
    }
    .kw-pag-btn:hover { background: var(--surface-light); }
    .kw-pag-btn.active { border: 1px solid var(--accent-primary); color: var(--ink-primary); }
    .kw-pag-btn:disabled { color: var(--ink-light); cursor: default; }
    .kw-pag-btn:disabled:hover { background: transparent; }
    .kw-pag-btn svg { width: 16px; height: 16px; display: block; }

    /* Right panel */
    .kw-modal__right {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--surface-lighter);
      min-height: 0;
    }

    .kw-right__header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 24px;
      height: 56px;
      background: var(--surface-primary);
      border-bottom: 1px solid var(--edge-primary);
      flex-shrink: 0;
    }

    .kw-right__count {
      flex: 1;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.14px;
      line-height: 20px;
    }

    .kw-right__count span {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink-primary);
    }

    .kw-remove-all {
      background: none;
      border: none;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.14px;
      color: var(--accent-primary);
      cursor: pointer;
      padding: 0;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .kw-remove-all:hover { color: #1f5fa8; }

    .kw-right__items {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    .kw-sel-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 24px;
      border-bottom: 1px solid var(--edge-primary);
      background: var(--surface-primary);
    }

    .kw-sel-item__info {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-width: 0;
    }

    .kw-sel-item__word {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: -0.14px;
      line-height: 20px;
      color: var(--ink-primary);
    }

    .kw-sel-item__type {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.88px;
      text-transform: uppercase;
      line-height: 15px;
      color: var(--ink-primary);
      flex-shrink: 0;
    }

    .kw-sel-item__remove {
      width: 20px;
      height: 20px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-dark);
      border-radius: var(--radius-sm);
      flex-shrink: 0;
      padding: 0;
    }
    .kw-sel-item__remove:hover { color: var(--ink-primary); }
    .kw-sel-item__remove svg { width: 16px; height: 16px; display: block; }

    /* Modal footer */
    .kw-modal__footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
      padding: 20px 24px;
      border-top: 1px solid var(--edge-primary);
      background: var(--surface-primary);
      flex-shrink: 0;
    }

              <svg class="kw-search-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.4"/>
                <path d="M11 11l3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
              <input class="kw-modal-search" type="search" placeholder="Search" aria-label="Search keywords" />
            </div>
            <div class="kw-filter-row">
              <div class="kw-chips">
                <div class="kw-chip-wrap" id="strategy-chip-wrap">
                  <button class="kw-chip" id="strategy-chip">
                    <span class="kw-chip-label">Strategy</span>
                    <span class="kw-chip-sep" hidden></span>
                    <span class="kw-chip-value" hidden></span>
                    <span class="kw-chip-close" hidden><svg viewBox="0 0 10 10" fill="none"><path d="M8 2L2 8M2 2l6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
                    <svg class="kw-chip-chevron" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                      <path d="M5 8l5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </button>
                </div>
                <div class="kw-chip-wrap" id="match-type-chip-wrap">
                  <button class="kw-chip" id="match-type-chip">
                    <span class="kw-chip-label">Match Type</span>
                    <span class="kw-chip-sep" hidden></span>
                    <span class="kw-chip-value" hidden></span>
                    <span class="kw-chip-close" hidden><svg viewBox="0 0 10 10" fill="none"><path d="M8 2L2 8M2 2l6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
                    <svg class="kw-chip-chevron" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                      <path d="M5 8l5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </button>
                </div>
              </div>
              <button class="kw-clear-filters" id="kw-clear-filters-btn">Clear Filters</button>
            </div>
          </div>

          <!-- Keyword table -->
          <div class="kw-modal__table-wrap">
            <table class="kw-sel-table" id="kw-sel-table">
              <colgroup>
                <col /><col /><col /><col /><col />
              </colgroup>
              <thead>
                <tr>
                  <th></th>
                  <th>Rank</th>
                  <th>Keyword</th>
                  <th>
                    <span style="display:inline-flex;align-items:center;gap:6px;">
                      Strategy
                      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" style="color:var(--ink-dark);flex-shrink:0" aria-hidden="true">
                        <path d="M7.0382 5.59678C6.86008 5.77207 6.71908 6.05617 6.84678 6.56699C6.94724 6.96884 6.70291 7.37603 6.30106 7.47649C5.89922 7.57695 5.49202 7.33262 5.39156 6.93077C5.14447 5.94234 5.40246 5.102 5.98605 4.52767C6.53447 3.98796 7.30025 3.75 7.99326 3.75C8.64298 3.75 9.32229 3.90938 9.84667 4.37427C10.3873 4.85352 10.6479 5.55426 10.6479 6.3928C10.6479 6.96882 10.4772 7.42801 10.2072 7.79984C9.95421 8.14823 9.63038 8.3939 9.39293 8.57035C8.83804 8.98269 8.74326 9.07956 8.74326 9.31692V9.76213C8.74323 10.1763 8.40742 10.513 7.99321 10.513C7.57899 10.5129 7.24323 10.1771 7.24326 9.76292V9.31694C7.24324 8.27794 7.98116 7.74225 8.40522 7.4344C8.4383 7.41038 8.46948 7.38775 8.49825 7.36638C8.73696 7.18898 8.8893 7.06189 8.99344 6.91847C9.08057 6.79849 9.14793 6.64682 9.14793 6.3928C9.14793 5.86888 8.99431 5.62321 8.85159 5.49669C8.69267 5.35579 8.41965 5.25 7.99326 5.25C7.61016 5.25 7.2515 5.38686 7.0382 5.59678Z" fill="currentColor"/>
                        <path d="M8.75 12C8.75 12.4142 8.41421 12.75 8 12.75C7.58579 12.75 7.25 12.4142 7.25 12C7.25 11.5858 7.58579 11.25 8 11.25C8.41421 11.25 8.75 11.5858 8.75 12Z" fill="currentColor"/>
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M8 0C3.58172 0 0 3.58172 0 8C0 12.4183 3.58172 16 8 16C12.4183 16 16 12.4183 16 8C16 3.58172 12.4183 0 8 0ZM1.5 8C1.5 4.41015 4.41015 1.5 8 1.5C11.5899 1.5 14.5 4.41015 14.5 8C14.5 11.5899 11.5899 14.5 8 14.5C4.41015 14.5 1.5 11.5899 1.5 8Z" fill="currentColor"/>
                      </svg>

                  </th>
                  <th id="add-all-th">Add All</th>

              </thead>
              <tbody id="kw-sel-tbody"></tbody>
            </table>
          </div>

          <!-- Pagination -->
          <div class="kw-modal__pagination">
            <span class="kw-pag-info">Showing <strong>1–10</strong> of <strong>10,000</strong></span>
            <div class="kw-pag-controls">
              <button class="kw-pag-btn" disabled aria-label="First page">
                <svg viewBox="0 0 16 16" fill="none"><path d="M11 12L6 8l5-4M4 4v8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <button class="kw-pag-btn" disabled aria-label="Previous page">
                <svg viewBox="0 0 16 16" fill="none"><path d="M10 12L6 8l4-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <button class="kw-pag-btn active">1</button>
              <button class="kw-pag-btn">2</button>
              <button class="kw-pag-btn">3</button>
              <button class="kw-pag-btn">4</button>
              <button class="kw-pag-btn" aria-label="Next page">
                <svg viewBox="0 0 16 16" fill="none"><path d="M6 12l4-4-4-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <button class="kw-pag-btn" aria-label="Last page">
                <svg viewBox="0 0 16 16" fill="none"><path d="M5 12l5-4-5-4M12 4v8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
          </div>
        </div>

        <!-- Right: selected keywords -->
        <div class="kw-modal__right">
          <div class="kw-right__header">
            <div class="kw-right__count" id="kw-right-count">0 keywords added</div>
            <button class="kw-remove-all" id="kw-remove-all">Remove All</button>
          </div>
          <div class="kw-right__items" id="kw-right-items"></div>
        </div>

      </div>

      <!-- Footer -->
      <div class="kw-modal__footer">
        <button class="btn btn-tertiary" id="kw-cancel-btn">Cancel</button>
        <button class="btn btn-primary" id="kw-save-btn">Save</button>
      </div>

    </div>
  </div>

  <script>
    /* ── Keyword data ─────────────────────────────────────────────────── */
    const KW_DATA = [
      { id: 1, rank: 1,  keyword: 'soft drinks',    tags: ['Defend', 'Drives Clicks'] },
      { id: 2, rank: 2,  keyword: 'beverages',      tags: ['Potential', 'Previously Boosted', 'Drives Clicks'] },
      { id: 3, rank: 3,  keyword: 'soda',           tags: ['Battleground', 'Previously Boosted', 'High Traffic'] },
      { id: 4, rank: 4,  keyword: 'sugar free',     tags: ['Defend'] },
      { id: 5, rank: 5,  keyword: 'diet cola',      tags: ['High Traffic'] },
      { id: 6, rank: 6,  keyword: 'sparkling water',tags: ['Potential'] },
      { id: 7, rank: 7,  keyword: 'energy drinks',  tags: ['Battleground'] },
      { id: 8, rank: 8,  keyword: 'juice',          tags: ['Defend'] },
      { id: 9, rank: 9,  keyword: 'lemonade',       tags: ['Drives Clicks'] },
      { id: 10, rank: 10,keyword: 'iced tea',       tags: ['Previously Boosted'] },
    ];

    const MATCH_TYPES = ['exact', 'phrase', 'broad'];

    /* ── Selection state (persists across modal opens) ────────────────── */
    // Map<kwId, Set<matchType>>
    let savedSelection = new Map();
    // Working copy while modal is open
    let workingSelection = new Map();
    // Expanded rows in modal
    let expandedRows = new Set();
    let strategyFilter = new Set();   // stores tag strings e.g. 'Defend'
    let matchTypeFilter = new Set();  // stores lowercase e.g. 'exact'

    /* ── Helpers ──────────────────────────────────────────────────────── */
    function cloneSelection(src) {
      const dst = new Map();
      src.forEach((types, id) => dst.set(id, new Set(types)));
      return dst;
    }

    function getKwById(id) {
      return KW_DATA.find(k => k.id === id);
    }

    function countSelectedKeywords(sel) {
      return [...sel.values()].filter(s => s.size > 0).length;
    }

    function countSelectedKeywordLabel(sel) {
      const n = countSelectedKeywords(sel);
      return `${n} keyword${n !== 1 ? 's' : ''} added`;
    }

    function isAdded(kwId, type) {
      return workingSelection.has(kwId) && workingSelection.get(kwId).has(type);
    }

    function addType(kwId, type) {
      if (!workingSelection.has(kwId)) workingSelection.set(kwId, new Set());
      workingSelection.get(kwId).add(type);
    }

    function removeType(kwId, type) {
      if (!workingSelection.has(kwId)) return;
      workingSelection.get(kwId).delete(type);
    }

    /* ── Modal open/close ─────────────────────────────────────────────── */
    function openModal() {
      workingSelection = cloneSelection(savedSelection);
      expandedRows.clear();
      renderModal();
      document.getElementById('kw-modal-overlay').style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('kw-modal-overlay').style.display = 'none';
      document.body.style.overflow = '';
    }

    document.getElementById('enter-keywords-btn').addEventListener('click', openModal);
    document.getElementById('edit-keywords-btn').addEventListener('click', openModal);
    document.getElementById('kw-modal-close').addEventListener('click', closeModal);
    document.getElementById('kw-cancel-btn').addEventListener('click', closeModal);

    document.getElementById('kw-modal-overlay').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    /* ── Modal render ─────────────────────────────────────────────────── */
    function renderModal() {
      renderTable();
      renderRightPanel();
    }

    function renderTable() {
      const tbody = document.getElementById('kw-sel-tbody');
      tbody.innerHTML = '';

      const visibleKWs = strategyFilter.size > 0
        ? KW_DATA.filter(kw => kw.tags.some(t => strategyFilter.has(t)))
        : KW_DATA;

      const visibleTypes = matchTypeFilter.size > 0
        ? MATCH_TYPES.filter(t => matchTypeFilter.has(t))
        : MATCH_TYPES;

      visibleKWs.forEach(kw => {
        const types = workingSelection.get(kw.id) || new Set();
        const allAdded = visibleTypes.every(t => types.has(t));
        const isExpanded = expandedRows.has(kw.id);

        // Main keyword row
        const tr = document.createElement('tr');
        tr.className = 'kw-row';
        tr.dataset.kwId = kw.id;
        tr.innerHTML = `
          <td>
            <button class="kw-chevron-btn" aria-label="${isExpanded ? 'Collapse' : 'Expand'} ${kw.keyword}">
              ${isExpanded ? chevronUpSvg() : chevronDownSvg()}
            </button>
          </td>
          <td class="kw-rank">${kw.rank}</td>
          <td class="kw-word">${kw.keyword}</td>
          <td><div class="tag-list">${kw.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div></td>
          <td>
            <button class="kw-add-btn${allAdded ? ' all-added' : ''}" ${allAdded ? 'disabled' : ''} data-kw-id="${kw.id}">
              ${allAdded ? 'Added' : 'Add'}
            </button>
          </td>`;
        tbody.appendChild(tr);

        tr.addEventListener('click', (e) => {
          if (e.target.closest('.kw-add-btn')) return;
          if (expandedRows.has(kw.id)) expandedRows.delete(kw.id);
          else expandedRows.add(kw.id);
          renderTable();
        });

        const addBtn = tr.querySelector('.kw-add-btn');
        if (addBtn && !allAdded) {
          addBtn.addEventListener('click', () => {
            visibleTypes.forEach(t => addType(kw.id, t));
            renderModal();
          });
        }

        // Expanded sub-row — only shows match types visible under current filter
        if (isExpanded) {
          const expTr = document.createElement('tr');
          expTr.className = 'kw-exp-row';
          expTr.innerHTML = `
            <td></td>
            <td></td>
            <td></td>
            <td>
              <div class="exp-types">
                ${visibleTypes.map(t => `<span class="exp-type-label">${t.charAt(0).toUpperCase() + t.slice(1)}</span>`).join('')}
              </div>
            </td>
            <td>
              <div class="exp-actions">
                ${visibleTypes.map(t => {
                  const added = types.has(t);
                  return `<button class="exp-add-btn${added ? ' is-added' : ''}" data-kw-id="${kw.id}" data-type="${t}" ${added ? 'disabled' : ''}>
                    ${added ? 'Added' : 'Add'}
                  </button>`;
                }).join('')}
              </div>
            </td>`;
          tbody.appendChild(expTr);

          expTr.querySelectorAll('.exp-add-btn:not([disabled])').forEach(btn => {
            btn.addEventListener('click', () => {
              addType(Number(btn.dataset.kwId), btn.dataset.type);
              renderModal();
            });
          });
        }
      });
    }

    function renderRightPanel() {
      const countEl = document.getElementById('kw-right-count');
      const itemsEl = document.getElementById('kw-right-items');

      countEl.textContent = countSelectedKeywordLabel(workingSelection);
      itemsEl.innerHTML = '';

      KW_DATA.forEach(kw => {
        const types = workingSelection.get(kw.id);
        if (!types || types.size === 0) return;
        MATCH_TYPES.forEach(type => {
          if (!types.has(type)) return;
          const item = document.createElement('div');
          item.className = 'kw-sel-item';
          item.innerHTML = `
            <div class="kw-sel-item__info">
              <span class="kw-sel-item__word">${kw.keyword}</span>
              <span class="kw-sel-item__type">${type}</span>
            </div>
            <button class="kw-sel-item__remove" aria-label="Remove ${kw.keyword} ${type}">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M12 4L4 12M4 4l8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
            </button>`;
          item.querySelector('.kw-sel-item__remove').addEventListener('click', () => {
            removeType(kw.id, type);
            renderModal();
          });
          itemsEl.appendChild(item);
        });
      });
    }

    /* ── Add All header ───────────────────────────────────────────────── */
    document.getElementById('add-all-th').addEventListener('click', () => {
      const typesToAdd = matchTypeFilter.size > 0
        ? MATCH_TYPES.filter(t => matchTypeFilter.has(t))
        : MATCH_TYPES;
      const visibleKWs = strategyFilter.size > 0
        ? KW_DATA.filter(kw => kw.tags.some(t => strategyFilter.has(t)))
        : KW_DATA;
      visibleKWs.forEach(kw => {
        typesToAdd.forEach(t => addType(kw.id, t));
      });
      renderModal();
    });

    /* ── Remove All ───────────────────────────────────────────────────── */
    document.getElementById('kw-remove-all').addEventListener('click', () => {
      workingSelection.clear();
      expandedRows.clear();
      renderModal();
    });

    /* ── Save ─────────────────────────────────────────────────────────── */
    document.getElementById('kw-save-btn').addEventListener('click', () => {
      savedSelection = cloneSelection(workingSelection);
      rebuildBidTable();
      closeModal();
    });

    /* ── Bid table ────────────────────────────────────────────────────── */
    function getDefaultBid() {
      return document.getElementById('default-bid-chip').dataset.bid || '1.00';
    }

    function rebuildBidTable() {
      const tbody = document.getElementById('bid-tbody');
      tbody.innerHTML = '';

      let rowCount = 0;
      KW_DATA.forEach(kw => {
        const types = savedSelection.get(kw.id);
        if (!types || types.size === 0) return;
        const selectedTypes = MATCH_TYPES.filter(t => types.has(t));
        addBidRow(kw, selectedTypes);
        rowCount++;
      });

      const empty = document.getElementById('kw-empty');
      const tableWrap = document.getElementById('kw-table-wrap');
      const badge = document.getElementById('kw-badge');
      const showing = document.getElementById('page-showing');
      const total = document.getElementById('page-total');

      if (rowCount > 0) {
        empty.style.display = 'none';
        tableWrap.style.display = 'block';
        badge.style.display = '';
      } else {
        empty.style.display = '';
        tableWrap.style.display = 'none';
        badge.style.display = 'none';
      }

      badge.textContent = rowCount;
      if (showing) showing.textContent = rowCount > 0 ? `1–${rowCount}` : '0–0';
      if (total) total.textContent = rowCount;
    }

    function addBidRow(kw, matchTypes) {
      const tbody = document.getElementById('bid-tbody');
      const tr = document.createElement('tr');

      const bidRowsHtml = matchTypes.map(t => `
        <div class="bid-row">
          <span class="match-type-label">${t.charAt(0).toUpperCase() + t.slice(1)}</span>
          <div class="bid-input"><span class="dollar">$</span><input type="text" placeholder="0.00" aria-label="${t} bid" /></div>
        </div>`).join('');

      tr.innerHTML = `
        <td>${kw.keyword}</td>
        <td><div class="tag-list">${kw.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div></td>
        <td>
          <div class="suggested-bid">
            <span class="suggested-bid__price">$0.75</span>
            <button class="suggested-bid__cta">Apply</button>
          </div>
        </td>
        <td class="cell-default">
          <button class="switch" data-on="false" aria-label="Use default bid" aria-pressed="false">
            <div class="switch__knob"></div>
          </button>
        </td>
        <td><div class="bid-rows">${bidRowsHtml}</div></td>`;

      tbody.appendChild(tr);

      tr.querySelector('.suggested-bid__cta').addEventListener('click', () => {
        if (tr.querySelector('.switch').dataset.on === 'true') return;
        const price = tr.querySelector('.suggested-bid__price').textContent.replace('$', '').trim();
        tr.querySelectorAll('.bid-input input').forEach(f => f.value = price);
        const btn = tr.querySelector('.suggested-bid__cta');
        btn.disabled = true; btn.textContent = 'Applied';
      });

      tr.querySelector('.switch').addEventListener('click', () => {
        const sw = tr.querySelector('.switch');
        const newOn = sw.dataset.on !== 'true';
        sw.dataset.on = String(newOn);
        sw.setAttribute('aria-pressed', String(newOn));
        const defaultBid = getDefaultBid();
        tr.querySelectorAll('.bid-input').forEach(bidWrap => {
          const field = bidWrap.querySelector('input');
          if (newOn) {
            field.dataset.savedValue = field.value;
            field.value = defaultBid;
            field.disabled = true;
            bidWrap.classList.add('disabled');
          } else {
            field.value = field.dataset.savedValue ?? '';
            field.disabled = false;
            bidWrap.classList.remove('disabled');
          }
        });
      });
    }

    // Re-enable Apply when input differs from suggested
    document.getElementById('bid-tbody').addEventListener('input', e => {
      if (!e.target.matches('.bid-input input')) return;
      const tableRow = e.target.closest('tr');
      const btn = tableRow.querySelector('.suggested-bid__cta');
      if (!btn || !btn.disabled) return;
      const price = tableRow.querySelector('.suggested-bid__price').textContent.replace('$', '').trim();
      const anyDiffers = [...tableRow.querySelectorAll('.bid-input input')].some(f => f.value.trim() !== price);
      if (anyDiffers) { btn.disabled = false; btn.textContent = 'Apply'; }
    });

    /* ── SVG helpers ──────────────────────────────────────────────────── */
    function chevronDownSvg() {
      return `<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    }
    function chevronUpSvg() {
      return `<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 10l4-4 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    }

    /* ── Chip dropdowns + filters ─────────────────────────────────────── */
    const ALL_STRATEGY_TAGS = [...new Set(KW_DATA.flatMap(k => k.tags))].sort();

    function makeDropdown(items, filterSet, keyFn, onChange) {
      const dd = document.createElement('div');
      dd.className = 'kw-dropdown';
      dd.setAttribute('hidden', '');

      items.forEach(item => {
        const key = keyFn ? keyFn(item) : item;
        const label = document.createElement('label');
        label.className = 'kw-dd-item';
        label.innerHTML = `
          <input type="checkbox"${filterSet.has(key) ? ' checked' : ''}>
          <div class="mds-check">
            <svg viewBox="0 0 10 10" fill="none"><path d="M2 5l2.5 2.5L8 3" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <span>${item}</span>`;
        const checkbox = label.querySelector('input');
        label.addEventListener('mousedown', e => e.stopPropagation());
        checkbox.addEventListener('change', e => {
          e.stopPropagation();
          if (checkbox.checked) filterSet.add(key);
          else filterSet.delete(key);
          onChange();
        });
        dd.appendChild(label);
      });

      const divider = document.createElement('div');
      divider.className = 'kw-dd-divider';
      dd.appendChild(divider);

      const footer = document.createElement('div');
      footer.className = 'kw-dd-footer';
      footer.innerHTML = `<button class="kw-dd-clear">Clear All</button>`;
      footer.querySelector('.kw-dd-clear').addEventListener('mousedown', e => e.stopPropagation());
      footer.querySelector('.kw-dd-clear').addEventListener('click', e => {
        e.stopPropagation();
        filterSet.clear();
        dd.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
        onChange();
      });
      dd.appendChild(footer);
      return dd;
    }

    function openDropdown(chip, dd) {
      closeAllDropdowns();
      dd.removeAttribute('hidden');
      chip.setAttribute('aria-expanded', 'true');
    }

    function closeAllDropdowns() {
      document.querySelectorAll('.kw-dropdown').forEach(d => d.setAttribute('hidden', ''));
      document.querySelectorAll('.kw-chip').forEach(c => c.removeAttribute('aria-expanded'));
    }

    function updateChipLabel(chipId, label, filterSet, allItems, keyFn = x => x) {
      const chip = document.getElementById(chipId);
      const hasSelection = filterSet.size > 0;
      chip.classList.toggle('has-selection', hasSelection);
      const sep   = chip.querySelector('.kw-chip-sep');
      const val   = chip.querySelector('.kw-chip-value');
      const close = chip.querySelector('.kw-chip-close');
      const chev  = chip.querySelector('.kw-chip-chevron');
      if (hasSelection) {
        const ordered = allItems.filter(i => filterSet.has(keyFn(i)));
        const extra = ordered.length - 1;
        val.textContent = extra > 0 ? `${ordered[0]} +${extra}` : ordered[0];
        sep.removeAttribute('hidden'); val.removeAttribute('hidden'); close.removeAttribute('hidden');
        chev.setAttribute('hidden', '');
      } else {
        sep.setAttribute('hidden', ''); val.setAttribute('hidden', ''); close.setAttribute('hidden', '');
        chev.removeAttribute('hidden');
      }
    }

    function updateClearFiltersBtn() {
      document.getElementById('kw-clear-filters-btn')
        .classList.toggle('active', strategyFilter.size > 0 || matchTypeFilter.size > 0);
    }

    function onFilterChange() {
      updateChipLabel('strategy-chip', 'Strategy', strategyFilter, ALL_STRATEGY_TAGS);
      updateChipLabel('match-type-chip', 'Match Type', matchTypeFilter, ['Exact', 'Phrase', 'Broad'], s => s.toLowerCase());
      updateClearFiltersBtn();
      renderTable();
    }

    function clearAllFilters() {
      strategyFilter.clear();
      matchTypeFilter.clear();
      document.querySelectorAll('.kw-dropdown input[type="checkbox"]').forEach(cb => cb.checked = false);
      onFilterChange();
    }

    (function buildDropdowns() {
      const strategyWrap   = document.getElementById('strategy-chip-wrap');
      const matchTypeWrap  = document.getElementById('match-type-chip-wrap');
      const strategyChip   = document.getElementById('strategy-chip');
      const matchTypeChip  = document.getElementById('match-type-chip');

      const strategyDd  = makeDropdown(ALL_STRATEGY_TAGS,           strategyFilter,  null,               onFilterChange);
      const matchTypeDd = makeDropdown(['Exact', 'Phrase', 'Broad'], matchTypeFilter, s => s.toLowerCase(), onFilterChange);

      strategyWrap.appendChild(strategyDd);
      matchTypeWrap.appendChild(matchTypeDd);

      strategyChip.addEventListener('mousedown', e => e.stopPropagation());
      strategyChip.addEventListener('click', e => {
        e.stopPropagation();
        if (e.target.closest('.kw-chip-close')) {
          strategyFilter.clear();
          strategyDd.querySelectorAll('input[type="checkbox"]').forEach(c => c.checked = false);
          onFilterChange(); return;
        }
        strategyDd.hasAttribute('hidden') ? openDropdown(strategyChip, strategyDd) : closeAllDropdowns();
      });

      matchTypeChip.addEventListener('mousedown', e => e.stopPropagation());
      matchTypeChip.addEventListener('click', e => {
        e.stopPropagation();
        if (e.target.closest('.kw-chip-close')) {
          matchTypeFilter.clear();
          matchTypeDd.querySelectorAll('input[type="checkbox"]').forEach(c => c.checked = false);
          onFilterChange(); return;
        }
        matchTypeDd.hasAttribute('hidden') ? openDropdown(matchTypeChip, matchTypeDd) : closeAllDropdowns();
      });
    })();

    document.addEventListener('click', closeAllDropdowns);
    document.getElementById('kw-clear-filters-btn').addEventListener('click', clearAllFilters);

    /* ── Tabs (visual only) ───────────────────────────────────────────── */
    document.querySelectorAll('.kw-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.kw-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
      });
    });
  </script>

  <!-- Notes widget -->
  <div id="__nw" style="position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;align-items:flex-end;gap:8px;font-family:'Inter',-apple-system,system-ui,sans-serif;">
    <div id="__np" style="display:none;width:288px;background:#fff;border:1px solid #e7eaee;border-radius:12px;box-shadow:0 8px 24px rgba(33,35,44,.12),0 2px 6px rgba(33,35,44,.08);overflow:hidden;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px 8px;border-bottom:1px solid #f0f2f5;">
        <span style="font-size:13px;font-weight:700;letter-spacing:-0.1px;color:#20203c;">Questions &amp; Notes</span>
        <button id="__nc" style="border:none;background:none;cursor:pointer;padding:2px;display:flex;color:#888b9a;border-radius:4px;" aria-label="Close notes">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M11 3L3 11M3 3l8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
      <textarea id="__nt" placeholder="Jot down questions…" style="width:100%;height:180px;padding:10px 12px;border:none;resize:none;font-family:inherit;font-size:13px;line-height:1.5;color:#20203c;background:#fff;outline:none;display:block;"></textarea>
    </div>
    <button id="__nb" aria-label="Open notes" style="width:40px;height:40px;border-radius:50%;background:#20203c;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(33,35,44,.2);color:#fff;transition:background 120ms;">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2.5 11.5V13.5H4.5L12 6L10 4L2.5 11.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M10 4L12 6" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
  </div>
  <script>
  (function(){
    if(window.self!==window.top)return;
    var p=document.getElementById('__np'),b=document.getElementById('__nb'),c=document.getElementById('__nc'),t=document.getElementById('__nt');
    var KEY='proto_notes';
    t.value=localStorage.getItem(KEY)||'';
    t.addEventListener('input',function(){localStorage.setItem(KEY,t.value);});
    function openPanel(){p.style.display='block';b.style.background='#535665';t.focus();}
    function closePanel(){p.style.display='none';b.style.background='#20203c';}
    b.addEventListener('click',function(){p.style.display==='none'?openPanel():closePanel();});
    c.addEventListener('click',closePanel);
    b.addEventListener('mouseenter',function(){if(p.style.display==='none')b.style.background='#535665';});
    b.addEventListener('mouseleave',function(){if(p.style.display==='none')b.style.background='#20203c';});
  })();
  </script>

</body>
